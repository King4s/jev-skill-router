name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Offline Python dependencies
        run: python3 -m pip install -r requirements-offline.txt
      - name: Python regression and self-check
        run: |
          python3 -B -m unittest -v test_router
          python3 -B router.py selftest
      - name: Rust format, tests, lint and release
        run: |
          cargo fmt --check
          cargo test --locked
          cargo clippy --locked -- -D warnings
          cargo build --release --locked
      - name: Actual stdio and HTTP MCP integration (offline provider)
        run: python3 -B scripts/mcp_smoke.py --binary ./target/release/jev-skill-router

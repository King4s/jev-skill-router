[package]
name = "jev-skill-router"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read-only MCP skill retrieval and TypeSafe Jev ranking"
repository = "https://github.com/King4s/jev-skill-router"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rmcp = { version = "=3.5.0", features = ["transport-io", "transport-streamable-http-server"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-util = "0.7"

